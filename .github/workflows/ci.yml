name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # finish both OSes even if one fails
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FolderSync.slnx

      - name: Build
        run: dotnet build FolderSync.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FolderSync.slnx --configuration Release --no-build --logger "console;verbosity=normal"
